                                        {data.logo}
                                    </div>
                                    <div>
                                        <h1 className="text-2xl font-bold text-gray-900">{data.company}</h1>
                                        <p className="text-indigo-600 font-medium">{data.role}</p>
                                    </div>
                                </div>
                                <div className="text-sm font-semibold text-gray-500 bg-gray-50 px-3 py-1.5 rounded-lg border border-gray-100 self-start md:self-center">
                                    {data.date}
                                </div>
                            </div>

                            {/* 详情内容 */}
                            <div className="prose prose-indigo max-w-none text-gray-600 leading-relaxed">
                                {/* 如果有 longDescription 则显示 HTML，否则显示默认列表 */}
                                {data.longDescription ? (
                                    <div dangerouslySetInnerHTML={{ __html: data.longDescription }} />
                                ) : (
                                    <ul className="space-y-4">
                                        {data.details.map((detail, idx) => (
                                            <li key={idx} className="flex gap-3">
                                                <span className="text-indigo-400 mt-1.5 min-w-[6px] h-[6px] rounded-full bg-indigo-400"></span>
                                                {detail}
                                            </li>
                                        ))}
                                    </ul>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const Experience = ({ onItemClick }) => {
            return (
                <section id="experience" className="py-20 bg-gray-50">
                    <div className="max-w-3xl mx-auto px-6">
                        <div className="flex items-center gap-3 mb-10">
                            <div className="p-2 bg-indigo-100 rounded text-indigo-600">
                                <Icons.Briefcase size={20} />
                            </div>
                            <h2 className="text-xl font-bold text-gray-900">工作经历</h2>
                        </div>
                        
                        <div className="space-y-6 relative before:absolute before:inset-0 before:ml-6 before:h-full before:w-0.5 before:-translate-x-px before:bg-gray-200 before:content-[''] md:before:mx-auto md:before:translate-x-0">
                        {resumeData.experience.map((exp, idx) => (
                            <div key={idx} className="relative group cursor-pointer" onClick={() => onItemClick(exp)}>
                                {/* Timeline Connector */}
                                <div className="absolute top-1 left-6 w-3 h-3 -ml-1.5 rounded-full bg-white border-2 border-indigo-500 z-10 md:left-1/2 md:-translate-x-1/2 mt-1.5 group-hover:scale-125 transition-transform"></div>
                                
                                <div className="md:flex justify-between items-start gap-8">
                                    {/* Left Side (Desktop): Date & Company */}
                                    <div className="md:w-1/2 md:text-right md:pr-10 mb-2 md:mb-0 pl-12 md:pl-0">
                                        <span className="inline-block text-xs font-semibold text-gray-500 mb-0.5">
                                        {exp.date}
                                        </span>
                                        <h3 className="text-base font-bold text-gray-900 leading-tight group-hover:text-indigo-600 transition-colors flex items-center md:justify-end gap-2">
                                            {exp.company}
                                            <span className="md:hidden"><Icons.ChevronRight size={14}/></span>
                                        </h3>
                                        <div className="text-xs font-medium text-indigo-600">{exp.role}</div>
                                    </div>

                                    {/* Right Side (Desktop): Details */}
                                    <div className="md:w-1/2 pl-12 md:pl-10 pb-8">
                                        <div className="bg-white rounded-lg p-5 shadow-sm border border-gray-100 group-hover:shadow-md group-hover:border-indigo-100 transition-all relative">
                                            {/* Hover Hint */}
                                            <div className="absolute right-4 top-4 opacity-0 group-hover:opacity-100 transition-opacity text-indigo-400">
                                                <Icons.ChevronRight size={16} />
                                            </div>
                                            <ul className="space-y-2">
                                                {exp.details.slice(0, 2).map((detail, dIdx) => (
                                                <li key={dIdx} className="text-gray-600 text-xs leading-relaxed flex items-start gap-2">
                                                    <span className="text-indigo-400 mt-1 min-w-[4px] h-[4px] bg-indigo-400 rounded-full"></span>
                                                    <span className="line-clamp-2">{detail}</span>
                                                </li>
                                                ))}
                                            </ul>
                                            <div className="mt-3 text-[10px] font-semibold text-indigo-500 opacity-0 group-hover:opacity-100 transition-opacity">
                                                点击查看详情 →
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ))}
                        </div>
                    </div>
                </section>
            );
        };

        // ... Education, Skills, Projects, Footer remain largely same but simplified for brevity in this response ...
        const Education = () => (
            <section className="py-20 bg-white border-t border-gray-100">
                <div className="max-w-5xl mx-auto px-6">
                <div className="text-center mb-12">
                    <h2 className="text-xl font-bold text-gray-900 mb-2">教育背景</h2>
                    <p className="text-xs text-gray-500">学术旅程</p>
                </div>
                <div className="grid md:grid-cols-3 gap-6">
                    {resumeData.education.map((edu, idx) => (
                        <div key={idx} className="bg-gray-50 p-6 rounded-xl border border-gray-100 hover:border-indigo-200 transition-all group">
                            <div className="flex justify-between items-start mb-3">
                                <div className="w-8 h-8 bg-white rounded-md flex items-center justify-center text-indigo-600 shadow-sm"><Icons.GraduationCap size={16} /></div>
                                <div className="text-[10px] font-bold text-gray-400 bg-white px-2 py-1 rounded border border-gray-100">{edu.date}</div>
                            </div>
                            <h3 className="text-sm font-bold text-gray-900 mb-1">{edu.school}</h3>
                            <div className="text-xs font-medium text-gray-600 mb-3">{edu.degree}</div>
                            <p className="text-xs text-gray-500 mb-4 leading-relaxed line-clamp-3">{edu.desc}</p>
                            <div className="flex flex-wrap gap-1.5">{edu.tags.map((tag, i) => (<span key={i} className="text-[10px] bg-white text-gray-500 px-1.5 py-0.5 rounded border border-gray-100">{tag}</span>))}</div>
                        </div>
                    ))}
                </div>
                </div>
            </section>
        );

        const Skills = () => {
            const getIcon = (name) => {
                const IconComp = Icons[name] || Icons.Code;
                return <IconComp size={18} />;
            };
            return (
                <section className="py-20 bg-gray-50">
                    <div className="max-w-4xl mx-auto px-6">
                        <h2 className="text-xl font-bold text-gray-900 mb-10 text-center">核心技能</h2>
                        <div className="space-y-6">
                        {resumeData.skills.map((skillGroup, idx) => (
                            <div key={idx} className="flex flex-col md:flex-row gap-4 md:items-center bg-white p-6 rounded-xl border border-gray-100 shadow-sm">
                                <div className="md:w-1/4 flex items-center gap-3">
                                    <div className="p-1.5 bg-indigo-50 rounded text-indigo-600">{getIcon(skillGroup.icon)}</div>
                                    <h3 className="font-bold text-gray-800 text-sm">{skillGroup.category}</h3>
                                </div>
                                <div className="md:w-3/4 flex flex-wrap gap-2">{skillGroup.items.map((skill, sIdx) => (<span key={sIdx} className="px-3 py-1 bg-gray-50 text-gray-600 text-xs rounded-full border border-gray-100">{skill}</span>))}</div>
                            </div>
                        ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Projects = () => (
            <section id="projects" className="py-20 bg-white border-t border-gray-100">
                <div className="max-w-5xl mx-auto px-6">
                    <div className="flex justify-between items-end mb-10">
                        <div><h2 className="text-xl font-bold text-gray-900 mb-1">精选项目</h2><p className="text-gray-500 text-xs">实践成果展示</p></div>
                        <a href="#" className="hidden md:flex items-center gap-1 text-xs font-medium text-indigo-600 hover:text-indigo-700">Github <Icons.ExternalLink size={12} /></a>
                    </div>
                    <div className="grid md:grid-cols-2 gap-6">
                        {resumeData.projects.map((proj, idx) => (
                        <div key={idx} className="bg-white rounded-xl p-6 shadow-sm hover:shadow-md transition-shadow duration-300 border border-gray-100 flex flex-col h-full">
                            <div className="flex justify-between items-start mb-3">
                                <div className="p-1.5 bg-indigo-50 rounded text-indigo-600"><Icons.Code size={16} /></div>
                                <div className="text-[10px] font-medium bg-gray-50 text-gray-500 px-2 py-0.5 rounded">{proj.subtitle}</div>
                            </div>
                            <h3 className="text-base font-bold text-gray-900 mb-2">{proj.title}</h3>
                            <p className="text-gray-500 text-xs leading-relaxed mb-4 flex-grow">{proj.desc}</p>
                            <div className="pt-4 border-t border-gray-50"><div className="flex flex-wrap gap-1.5">{proj.tech.map((t, i) => (<span key={i} className="text-[10px] font-medium text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full">{t}</span>))}</div></div>
                        </div>
                        ))}
                    </div>
                </div>
            </section>
        );

        const Footer = () => (
            <footer className="py-8 bg-gray-50 border-t border-gray-100 text-center">
                <div className="max-w-2xl mx-auto px-6">
                    <h2 className="text-lg font-bold text-gray-900 mb-4">Let's Connect</h2>
                    <div className="flex justify-center gap-4 mb-6">
                        <a href="mailto:kaiwenchen66@126.com" className="w-8 h-8 flex items-center justify-center bg-white shadow-sm rounded-full text-gray-600 hover:text-indigo-600 transition-all"><Icons.Mail size={16} /></a>
                        <a href="#" className="w-8 h-8 flex items-center justify-center bg-white shadow-sm rounded-full text-gray-600 hover:text-indigo-600 transition-all"><Icons.Linkedin size={16} /></a>
                        <a href="#" className="w-8 h-8 flex items-center justify-center bg-white shadow-sm rounded-full text-gray-600 hover:text-indigo-600 transition-all"><Icons.Github size={16} /></a>
                    </div>
                    <div className="text-gray-400 text-xs">© 2025 Kevin Chen. </div>
                </div>
            </footer>
        );

        const App = () => {
            const [view, setView] = useState('home'); // 'home' | 'detail'
            const [selectedItem, setSelectedItem] = useState(null);

            const handleNavigate = (targetView, sectionId) => {
                setView(targetView);
                setSelectedItem(null);
                if (targetView === 'home' && sectionId) {
                    setTimeout(() => {
                        const el = document.getElementById(sectionId);
                        if (el) el.scrollIntoView({ behavior: 'smooth' });
                    }, 100);
                } else {
                    window.scrollTo(0,0);
                }
            };

            const handleItemClick = (item) => {
                setSelectedItem(item);
                setView('detail');
            };

            return (
                <div className="bg-white min-h-screen font-sans selection:bg-indigo-100 selection:text-indigo-900">
                    <Navbar onNavigate={handleNavigate} />
                    
                    {view === 'home' ? (
                        <>
                            <Hero />
                            <StatsBar />
                            <Experience onItemClick={handleItemClick} />
                            <Education />
                            <Skills />
                            <Projects />
                        </>
                    ) : (
                        <DetailPage 
                            data={selectedItem} 
                            onBack={() => setView('home')} 
                        />
                    )}
                    
                    <Footer />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
